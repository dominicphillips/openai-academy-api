[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openai-academy-api"
version = "0.1.0"
description = "Read-only structured metadata for public OpenAI Academy resources"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0,<1",
  "pydantic>=2.14.1,<3",
  "openai>=3.38.0,<4",
  "uvicorn>=0.54.0,<1",
]

[project.scripts]
academy-api = "openai_academy_api.cli:serve"
academy-collector = "openai_academy_api.cli:collect"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "httpx>=0.28.1,<1", "ruff>=0.17.2,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_academy_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
